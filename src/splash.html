<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LetterForge Pro - Caricamento</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@700;800&display=swap');
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    :root {
      --bg: #0d0d0f;
      --panel: #13131a;
      --panel2: #1a1a25;
      --border: #2a2a3a;
      --accent: #c8ff00;
      --accent2: #ff6b35;
      --text: #e8e8f0;
      --muted: #5a5a7a;
      --card-radius: 24px;
    }
    
    body {
      height: 100vh;
      width: 100vw;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      /* Drag disabled as requested */
    }
    
    .card {
      background: var(--panel);
      width: 420px;
      padding: 48px 40px;
      border-radius: var(--card-radius);
      border: 1px solid var(--border);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 20px rgba(200, 255, 0, 0.03);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      position: relative;
      overflow: hidden;
    }

    /* Decorative gradient corner */
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 150px;
      height: 150px;
      background: radial-gradient(circle at top right, rgba(200, 255, 0, 0.08), transparent 70%);
      pointer-events: none;
    }
    
    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    
    .logo .light {
      color: var(--accent);
    }
    
    .logo .dark {
      color: var(--text);
    }
    
    .tagline {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: var(--muted);
      font-weight: 600;
      margin-top: 4px;
    }
    
    .loading-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .progress-wrapper {
      width: 100%;
      height: 6px;
      background: var(--panel2);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #eaff80);
      border-radius: 10px;
      transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 0 12px rgba(200, 255, 0, 0.3);
    }
    
    .status-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-text {
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
    }
    
    .percent-text {
      font-size: 11px;
      color: var(--accent);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .version-tag {
      position: absolute;
      bottom: 16px;
      right: 20px;
      font-size: 9px;
      color: var(--border);
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    /* Subtle pulse animation for the status text */
    @keyframes pulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 0.5; }
    }
    
    .status-text:not(:empty) {
      animation: pulse 2s infinite ease-in-out;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <div class="logo">
        <span class="light">Letter</span><span class="dark">Forge</span>
      </div>
      <div class="tagline">Typography Studio</div>
    </div>
    
    <div class="loading-section">
      <div class="progress-wrapper">
        <div class="progress-bar" id="loading-bar"></div>
      </div>
      <div class="status-container">
        <div class="status-text" id="loading-status">Inizializzazione...</div>
        <div class="percent-text" id="loading-percent">0%</div>
      </div>
    </div>

    <div class="version-tag">PRO EDITION</div>
  </div>
  
  <script>
    let progress = 0;
    
    function updateProgress(percent, status) {
      progress = Math.min(100, Math.max(0, percent));
      const bar = document.getElementById('loading-bar');
      const percentEl = document.getElementById('loading-percent');
      const statusEl = document.getElementById('loading-status');
      
      bar.style.width = progress + '%';
      percentEl.textContent = Math.round(progress) + '%';
      if (status) {
        statusEl.textContent = status;
      }
    }
    
    if (window.electronAPI) {
      window.electronAPI.onSplashProgress((data) => {
        updateProgress(data.progress, data.status);
      });
      
      window.electronAPI.onSplashHide(() => {
        document.body.style.transition = 'all 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
        document.body.style.opacity = '0';
        document.body.style.transform = 'scale(0.95)';
        setTimeout(() => {
          document.body.style.display = 'none';
        }, 600);
      });
    }
    
    // Initial animation
    setTimeout(() => {
      updateProgress(15, 'Avvio sistema...');
    }, 100);
  </script>
</body>
</html>
